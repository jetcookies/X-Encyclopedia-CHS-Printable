name: Typst CI with Typix

on:
  pull_request:
    branches:
      - myfork
  push:
    branches:
      - myfork
    tags:        
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Typix compile
        run: nix run .#build
      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X Encyclopedia CHS v3-${{ steps.vars.outputs.sha_short }}
          path: X Encyclopedia CHS v3.pdf
          if-no-files-found: error
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          generate_release_notes: true
          files: X Encyclopedia CHS v3.pdf